<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RFS · Donegal Store Map</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#241d3a; --muted:#6b6580; --line:#e2ddef; --card:rgba(255,255,255,.82);
    --purple:#6d28d9; --purple2:#a78bfa; --gold:#d97706; --navy:#1e5da8;
    --spar:#0a8a3d; --sv:#c8102e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);overflow:hidden}
  #map{position:fixed;inset:0}
  #rain{position:fixed;inset:0;pointer-events:none;z-index:2}
  .maplibregl-ctrl-attrib{font-size:10px;opacity:.7}
  header{position:fixed;top:0;left:0;right:0;padding:14px 20px;display:flex;align-items:center;gap:14px;z-index:5;pointer-events:none}
  .brand{pointer-events:auto}
  header h1{font-family:'Sora';font-size:18px;margin:0;letter-spacing:-.2px}
  header .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .spacer{flex:1}
  .controls{display:flex;gap:8px;pointer-events:auto}
  .btn{font:inherit;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
       background:var(--card);color:var(--ink);cursor:pointer;backdrop-filter:blur(8px);transition:.15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:var(--purple2)}
  .btn.on{background:var(--purple);border-color:var(--purple);color:#fff}
  .ticker{position:fixed;left:50%;top:15px;transform:translateX(-50%);z-index:5;background:var(--card);border:1px solid var(--line);
          border-radius:999px;padding:6px 14px;font-size:12px;backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;max-width:46vw;overflow:hidden;white-space:nowrap}
  .ticker .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 1.6s infinite;flex:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .legend{position:fixed;left:20px;bottom:16px;z-index:5;display:flex;gap:14px;flex-wrap:wrap;align-items:center;
          background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 13px;backdrop-filter:blur(8px);font-size:11.5px}
  .legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .foot{position:fixed;right:14px;bottom:14px;z-index:5;font-size:10.5px;color:var(--muted);max-width:290px;text-align:right;
        background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 9px;backdrop-filter:blur(8px)}
  /* branded store pin */
  .pin{width:34px;height:34px;border-radius:50% 50% 50% 3px;transform:rotate(45deg);display:grid;place-items:center;
       box-shadow:0 5px 16px rgba(50,30,90,.30);border:2.5px solid #fff;cursor:pointer;transition:transform .15s}
  .pin:hover{transform:rotate(45deg) scale(1.12)}
  .pin span{transform:rotate(-45deg);font-size:13px;font-weight:800;color:#fff;font-family:'Sora'}
  .pinlab{position:absolute;top:-22px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);
          border-radius:7px;padding:1px 7px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 3px 10px rgba(50,30,90,.15)}
  /* side panel (unchanged look) */
  #panel{position:fixed;top:0;right:0;height:100%;width:390px;max-width:92vw;z-index:7;transform:translateX(105%);
         transition:transform .32s cubic-bezier(.4,0,.15,1);background:rgba(255,255,255,.9);backdrop-filter:blur(16px);
         border-left:1px solid var(--line);box-shadow:-16px 0 44px rgba(60,40,120,.12);overflow-y:auto}
  #panel.open{transform:none}
  .p-head{padding:20px 22px 14px;border-bottom:1px solid var(--line);position:relative}
  .p-brandtag{display:inline-block;font-size:11px;font-weight:700;color:#fff;padding:2px 9px;border-radius:6px;letter-spacing:.3px}
  .p-title{font-family:'Sora';font-size:21px;margin:9px 0 3px}
  .p-loc{font-size:12px;color:var(--muted)}
  .p-close{position:absolute;top:16px;right:16px;border:none;background:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1}
  .p-body{padding:16px 22px 40px}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  .kpi .l{font-size:11px;color:var(--muted)} .kpi .v{font-family:'Sora';font-size:20px;margin-top:2px}
  .kpi .v.gold{color:var(--gold)} .kpi .v.navy{color:var(--navy)}
  .sec{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
  #spark{width:100%;height:120px}
  .rowline{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .rowline .k{color:var(--muted)}
  .ev{display:flex;gap:9px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
  .ev .ic{width:22px;height:22px;border-radius:6px;flex:none;display:grid;place-items:center;font-size:12px;color:#fff}
  .ev .nm{font-weight:600;font-size:13px} .ev .dt{font-size:11px;color:var(--muted)}
  .ev .ef{margin-left:auto;font-size:12px;font-weight:700}
</style>
</head>
<body>
<div id="map"></div>
<canvas id="rain"></canvas>
<header>
  <a class="btn" href="index.html" title="Back to dashboard">← Dashboard</a>
  <div class="brand">
    <h1>Donegal store network</h1>
    <div class="sub">RFS Checkout Analytics · real map · live demand, weather & events</div>
  </div>
  <div class="spacer"></div>
  <div class="controls">
    <button class="btn" id="btn-weather">☔ Rain</button>
    <button class="btn on" id="btn-events">◎ Events</button>
    <button class="btn" id="btn-fit">⤢ Fit county</button>
  </div>
</header>
<div class="ticker"><span class="dot"></span><span id="ticker-txt">Loading…</span></div>
<div class="legend" id="legend"></div>
<div class="foot" id="foot"></div>
<aside id="panel"></aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
const BRAND={Spar:{c:'#0a8a3d',tag:'#0a8a3d',glyph:'S'},SuperValu:{c:'#c8102e',tag:'#c8102e',glyph:'SV'}};
const EVCOL={holiday:'#d97706',gaa:'#6d28d9',payday:'#1e5da8',event:'#6d28d9'};
let stores=[], selected=null, rainOn=false, eventsOn=true, bounds=null;

const map=new maplibregl.Map({
  container:'map',
  style:'https://tiles.openfreemap.org/styles/positron',   // real OSM, light theme
  center:[-7.85,54.95], zoom:8.4, pitch:0, bearing:0, attributionControl:false,
  preserveDrawingBuffer:true,
});
map.addControl(new maplibregl.AttributionControl({compact:true}),'bottom-right');
map.addControl(new maplibregl.NavigationControl({showCompass:true}),'bottom-right');
if(window.ResizeObserver) new ResizeObserver(()=>map.resize()).observe(document.getElementById('map'));

map.on('style.load',()=>{
  // 3D building extrusions from the OpenMapTiles building layer (light purple)
  try{
    map.addLayer({id:'buildings3d',type:'fill-extrusion',source:'openmaptiles','source-layer':'building',minzoom:13.5,
      paint:{'fill-extrusion-color':['interpolate',['linear'],['zoom'],13.5,'#dcd7ee',17,'#c3b9e6'],
        'fill-extrusion-height':['case',['has','render_height'],['get','render_height'],8],
        'fill-extrusion-base':['case',['has','render_min_height'],['get','render_min_height'],0],
        'fill-extrusion-opacity':.72}});
  }catch(e){}
});

const fmt=v=>v==null?'–':d3.format(',')(Math.round(v));
const pct=v=>v==null?'–':(v>0?'+':'')+v+'%';

// geographic circle polygon (km) for event radius
function circle(lng,lat,km,n=64){
  const co=[],dLat=km/110.574,dLng=km/(111.320*Math.cos(lat*Math.PI/180));
  for(let i=0;i<=n;i++){const a=i/n*2*Math.PI;co.push([lng+dLng*Math.cos(a),lat+dLat*Math.sin(a)]);}
  return {type:'Feature',geometry:{type:'Polygon',coordinates:[co]}};
}

fetch('./data/stores.json').then(r=>r.json()).then(d=>{
  stores=d.stores;
  document.getElementById('foot').textContent=d.disclaimer;
  buildLegend(); buildTicker();
  bounds=new maplibregl.LngLatBounds();
  stores.forEach(s=>{
    const b=BRAND[s.brand]||BRAND.Spar;
    // marker element: label + teardrop pin
    const wrap=document.createElement('div'); wrap.style.position='relative';
    const lab=document.createElement('div'); lab.className='pinlab'; lab.textContent=s.town; wrap.appendChild(lab);
    const pin=document.createElement('div'); pin.className='pin'; pin.style.background=b.c;
    pin.innerHTML=`<span>${b.glyph}</span>`; wrap.appendChild(pin);
    pin.addEventListener('click',()=>selectStore(s));
    s._marker=new maplibregl.Marker({element:wrap,anchor:'bottom'}).setLngLat([s.lon,s.lat]).addTo(map);
    bounds.extend([s.lon,s.lat]);
    // event radius (if any upcoming events) — a soft ring around the store
    if((s.events||[]).length){
      const et=s.events[0].type, col=EVCOL[et]||EVCOL.event;
      const src='ring-'+s.key;
      map.on('load',()=>{ addRing(src,circle(s.lon,s.lat,3.2),col); });
      if(map.isStyleLoaded()) addRing(src,circle(s.lon,s.lat,3.2),col);
      s._ring=src; s._ringcol=col;
    }
  });
  fitToStores(true);
  pulseRings();
}).catch(err=>{document.getElementById('ticker-txt').textContent='Could not load store data: '+err;});

function fitToStores(instant){
  if(!bounds||bounds.isEmpty())return;
  const go=()=>{map.resize();map.fitBounds(bounds,{padding:{top:120,bottom:90,left:90,right:410},maxZoom:10.5,duration:instant?0:1400});};
  if(map.loaded()) go(); else map.once('load',go);
}

function addRing(src,geo,col){
  if(map.getSource(src)) return;
  map.addSource(src,{type:'geojson',data:geo});
  map.addLayer({id:src+'-f',type:'fill',source:src,paint:{'fill-color':col,'fill-opacity':.08}});
  map.addLayer({id:src+'-l',type:'line',source:src,paint:{'line-color':col,'line-width':2,'line-opacity':.6}});
}
function pulseRings(){
  const t=(performance.now()/1000)%2/2; // 0..1 (perf.now allowed in browser)
  stores.forEach(s=>{ if(s._ring && map.getLayer(s._ring+'-l')){
    map.setPaintProperty(s._ring+'-l','line-opacity', eventsOn?(0.15+0.5*(1-t)):0);
    map.setPaintProperty(s._ring+'-f','fill-opacity', eventsOn?(0.03+0.09*(1-t)):0);
  }});
  requestAnimationFrame(pulseRings);
}

function selectStore(s){
  openPanel(s);
  map.flyTo({center:[s.lon,s.lat],zoom:16.4,pitch:58,bearing:-18,duration:2400,curve:1.5,essential:true});
  map.once('moveend',()=>{setTimeout(()=>highlightBuilding(s),250);
    setTimeout(()=>{if(map.getSource('sel-bld')&&!map.getSource('sel-bld')._data.features.length)highlightBuilding(s);},900);});
}
// paint the store's actual OSM building in its brand colour ("embedded" on the shop).
// Only at high zoom, where the building layer holds individual footprints; at low zoom
// OpenMapTiles merges them into one big tile geometry, which must not be highlighted.
function spanMetres(geom){
  const pts=[]; const walk=a=>{typeof a[0]==='number'?pts.push(a):a.forEach(walk);}; walk(geom.coordinates);
  const lo=pts.map(p=>p[0]),la=pts.map(p=>p[1]);
  return {n:pts.length, m:Math.max((Math.max(...lo)-Math.min(...lo))*72000,(Math.max(...la)-Math.min(...la))*111000)};
}
function highlightBuilding(s){
  const b=BRAND[s.brand]||BRAND.Spar;
  if(!map.getLayer('buildings3d')){return;}
  // colour the 3D buildings across the store's whole area in its brand colour
  const c=map.project([s.lon,s.lat]), R=200;
  let feats=map.queryRenderedFeatures([[c.x-R,c.y-R],[c.x+R,c.y+R]],{layers:['buildings3d']});
  if(!feats.length && s.footprint) feats=[{geometry:{type:'Polygon',coordinates:s.footprint},properties:{}}];
  const geo={type:'FeatureCollection',features:feats.map(f=>({type:'Feature',geometry:f.geometry,
    properties:{h:(f.properties&&f.properties.render_height)||12}}))};
  if(map.getSource('sel-bld')){ map.getSource('sel-bld').setData(geo); map.setPaintProperty('sel-bld','fill-extrusion-color',b.c); }
  else{
    map.addSource('sel-bld',{type:'geojson',data:geo});
    map.addLayer({id:'sel-bld',type:'fill-extrusion',source:'sel-bld',
      paint:{'fill-extrusion-color':b.c,'fill-extrusion-height':['+',['coalesce',['get','h'],12],4],
        'fill-extrusion-base':0,'fill-extrusion-opacity':.9}});
  }
}
function clearBuilding(){ if(map.getSource('sel-bld')) map.getSource('sel-bld').setData({type:'FeatureCollection',features:[]}); }

function buildLegend(){
  document.getElementById('legend').innerHTML=
    `<span><span class="sw" style="background:${BRAND.Spar.c}"></span><b>Spar</b></span>
     <span><span class="sw" style="background:${BRAND.SuperValu.c}"></span><b>SuperValu</b></span>
     <span><span class="sw" style="background:${EVCOL.holiday}"></span>Holiday</span>
     <span><span class="sw" style="background:${EVCOL.gaa}"></span>GAA window</span>
     <span><span class="sw" style="background:${EVCOL.payday}"></span>Pay window</span>
     <span style="color:var(--muted)">Real OpenStreetMap · click a store</span>`;
}
function buildTicker(){
  const items=[]; stores.forEach(s=>(s.events||[]).forEach(e=>{ if(e.type==='holiday') items.push(`${s.town}: ${e.name} ${pct(e.effect_pct)}`); }));
  document.getElementById('ticker-txt').textContent=items.length?('Coming up · '+items.join('   ·   ')):'No public holidays in the current horizon';
}

function openPanel(s){
  selected=s; const col=BRAND[s.brand]||BRAND.Spar;
  const ev=(s.events||[]).map(e=>{
    const when=e.date||`${e.start} → ${e.end}`, c=EVCOL[e.type]||EVCOL.event, ic={holiday:'★',gaa:'●',payday:'€',event:'◆'}[e.type]||'◆';
    return `<div class="ev"><div class="ic" style="background:${c}">${ic}</div>
      <div><div class="nm">${e.name}</div><div class="dt">${when}</div></div>
      <div class="ef" style="color:${c}">${e.effect_pct!=null?pct(e.effect_pct):''}</div></div>`;
  }).join('')||'<div class="dt" style="color:var(--muted);font-size:12px">No known events in the horizon.</div>';
  document.getElementById('panel').innerHTML=`
    <div class="p-head">
      <button class="p-close" onclick="closePanel()">×</button>
      <span class="p-brandtag" style="background:${col.tag}">${s.brand}</span>
      <div class="p-title">${s.store_type} store</div>
      <div class="p-loc">${s.real_place||s.town}, Co. Donegal · ${s.checkouts} checkouts · representative branch</div>
    </div>
    <div class="p-body">
      <div class="kpis">
        <div class="kpi"><div class="l">Transactions / day</div><div class="v">${fmt(s.daily_txns)}</div></div>
        <div class="kpi"><div class="l">Next 2 weeks</div><div class="v navy">${fmt(s.next2w_txns)}</div></div>
        <div class="kpi"><div class="l">Busy days ahead</div><div class="v gold">${s.busy_days}</div></div>
        <div class="kpi"><div class="l">Peak lanes</div><div class="v">${s.peak_lanes??'–'}</div></div>
      </div>
      <div class="sec">Demand · recent + 2-week forecast</div>
      <svg id="spark"></svg>
      <div class="sec">What can move demand</div>
      <div class="rowline"><span class="k">Public holiday effect</span><b>${pct(s.holiday_effect_pct)}</b></div>
      <div class="rowline"><span class="k">Wet-day effect</span><b>${pct(s.weather.wet_effect_pct)}</b></div>
      <div class="rowline"><span class="k">Sunny-day effect</span><b>${pct(s.weather.sunny_effect_pct)}</b></div>
      <div class="sec">Coming up</div>${ev}
      <div class="sec">Operations</div>
      <div class="rowline"><span class="k">Forecast accuracy (MASE)</span><b>${s.median_mase??'–'}</b></div>
      <div class="rowline"><span class="k">Unusual days flagged</span><b>${fmt(s.n_unusual_days)}</b></div>
      <div class="rowline"><span class="k">Over / under staffed lane-hrs</span><b>${fmt(s.over_lane_hours)} / ${fmt(s.under_lane_hours)}</b></div>
      <div class="rowline"><span class="k">Mis-staffing cost</span><b>€${fmt(s.mis_staffing_cost)}</b></div>
    </div>`;
  document.getElementById('panel').classList.add('open');
  drawSpark(s);
}
function closePanel(){document.getElementById('panel').classList.remove('open');selected=null;clearBuilding();map.easeTo({pitch:0,duration:900});}

function drawSpark(s){
  const R=s.spark.recent,F=s.spark.forecast,LO=s.spark.low,HI=s.spark.high;
  const svg=d3.select('#spark'); svg.selectAll('*').remove();
  const wd=svg.node().clientWidth||340,ht=120,m={t:8,r:6,b:16,l:6},n=R.length+F.length;
  const x=d3.scaleLinear().domain([0,n-1]).range([m.l,wd-m.r]);
  const all=R.concat(F,LO,HI).filter(v=>v!=null);
  const y=d3.scaleLinear().domain([d3.min(all)*.96,d3.max(all)*1.04]).range([ht-m.b,m.t]);
  const band=F.map((_,i)=>({i:R.length+i,lo:LO[i],hi:HI[i]}));
  svg.append('path').datum(band).attr('d',d3.area().x(d=>x(d.i)).y0(d=>y(d.lo)).y1(d=>y(d.hi)).curve(d3.curveMonotoneX)).attr('fill','#a78bfa').attr('opacity',.28);
  svg.append('path').datum(R).attr('d',d3.line().x((d,i)=>x(i)).y(d=>y(d)).curve(d3.curveMonotoneX)).attr('fill','none').attr('stroke','#46587a').attr('stroke-width',1.6);
  svg.append('path').datum(F).attr('d',d3.line().x((d,i)=>x(R.length+i)).y(d=>y(d)).curve(d3.curveMonotoneX)).attr('fill','none').attr('stroke','#6d28d9').attr('stroke-width',2.2);
  svg.append('line').attr('x1',x(R.length-.5)).attr('x2',x(R.length-.5)).attr('y1',m.t).attr('y2',ht-m.b).attr('stroke','#241d3a').attr('stroke-opacity',.35).attr('stroke-dasharray','3 3');
  svg.append('text').attr('x',x(R.length-.5)+4).attr('y',m.t+9).attr('font-size',9).attr('fill','#6b6580').text('today');
}

// rain overlay
const rc=document.getElementById('rain'),rx=rc.getContext('2d');let drops=[],RW,RH;
function rainResize(){RW=rc.width=window.innerWidth;RH=rc.height=window.innerHeight;}
window.addEventListener('resize',rainResize);rainResize();
for(let i=0;i<260;i++)drops.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,l:9+Math.random()*13,s:6+Math.random()*6});
function rain(){rx.clearRect(0,0,RW,RH);if(rainOn){rx.strokeStyle='rgba(70,110,180,.32)';rx.lineWidth=1.1;
  drops.forEach(d=>{rx.beginPath();rx.moveTo(d.x,d.y);rx.lineTo(d.x-3,d.y+d.l);rx.stroke();d.y+=d.s;d.x-=1.6;if(d.y>RH){d.y=-10;d.x=Math.random()*RW;}});
  rx.fillStyle='rgba(150,175,210,.05)';rx.fillRect(0,0,RW,RH);}requestAnimationFrame(rain);}
rain();

document.getElementById('btn-weather').onclick=e=>{rainOn=!rainOn;e.target.classList.toggle('on',rainOn);};
document.getElementById('btn-events').onclick=e=>{eventsOn=!eventsOn;e.target.classList.toggle('on',eventsOn);};
document.getElementById('btn-fit').onclick=()=>{closePanel();fitToStores(false);};
</script>
</body>
</html>
