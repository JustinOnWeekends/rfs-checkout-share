<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RFS · Donegal Store Map</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#241d3a; --muted:#6b6580; --line:#e2ddef; --card:rgba(255,255,255,.82);
    --purple:#6d28d9; --purple2:#a78bfa; --gold:#d97706; --navy:#1e5da8;
    --spar:#0a8a3d; --sv:#c8102e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);overflow:hidden}
  #map{position:fixed;inset:0}
  #rain{position:fixed;inset:0;pointer-events:none;z-index:2}
  .maplibregl-ctrl-attrib{font-size:10px;opacity:.7}
  header{position:fixed;top:0;left:0;right:0;padding:14px 20px;display:flex;align-items:center;gap:14px;z-index:5;pointer-events:none}
  .brand{pointer-events:auto}
  header h1{font-family:'Sora';font-size:18px;margin:0;letter-spacing:-.2px}
  header .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .spacer{flex:1}
  .controls{display:flex;gap:8px;pointer-events:auto}
  .btn{font:inherit;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
       background:var(--card);color:var(--ink);cursor:pointer;backdrop-filter:blur(8px);transition:.15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;pointer-events:auto}
  .btn:hover{border-color:var(--purple2)}
  .btn.on{background:var(--purple);border-color:var(--purple);color:#fff}
  .ticker{position:fixed;left:50%;top:15px;transform:translateX(-50%);z-index:5;background:var(--card);border:1px solid var(--line);
          border-radius:999px;padding:6px 14px;font-size:12px;backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;max-width:46vw;overflow:hidden;white-space:nowrap}
  .ticker .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 1.6s infinite;flex:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .legend{position:fixed;left:20px;bottom:16px;z-index:5;display:flex;gap:14px;flex-wrap:wrap;align-items:center;
          background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 13px;backdrop-filter:blur(8px);font-size:11.5px}
  .legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .foot{position:fixed;right:14px;bottom:14px;z-index:5;font-size:10.5px;color:var(--muted);max-width:290px;text-align:right;
        background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 9px;backdrop-filter:blur(8px)}
  /* branded store location pin: round head + downward tip sitting on the building */
  .pinwrap{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer}
  .pinhead{background:var(--c);border:3px solid #fff;display:grid;place-items:center;
           box-shadow:0 5px 14px rgba(50,30,90,.35);transition:transform .15s}
  .pinhead.round{width:36px;height:36px;border-radius:50%}
  .pinhead.wide{height:26px;padding:0 10px;border-radius:15px}
  .pinwrap:hover .pinhead{transform:scale(1.12)}
  .pinhead .spar-fir{width:23px;height:23px;display:block}
  .pinhead .wm-sv{font-family:'Plus Jakarta Sans','Sora',sans-serif;font-weight:800;font-size:12.5px;
                  color:#fff;letter-spacing:-.2px;line-height:1;white-space:nowrap}
  .pintip{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;
          border-top:12px solid var(--c);margin-top:-2px;filter:drop-shadow(0 3px 2px rgba(50,30,90,.28))}
  .pinlab{position:absolute;top:-22px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);
          border-radius:7px;padding:1px 7px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 3px 10px rgba(50,30,90,.15)}
  .evbadge{background:#fff;border:1px solid var(--line);border-left:3px solid var(--c);border-radius:9px;padding:3px 9px;
           font-size:11px;font-weight:600;white-space:nowrap;box-shadow:0 4px 14px rgba(50,30,90,.18);cursor:pointer;color:var(--ink)}
  .evbadge .ed{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:0}
  .evbadge.urgent{animation:evp 1.3s infinite}
  @keyframes evp{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  /* nearby back-to-school driver: a small dot on the real school, with its surge % */
  .school{display:flex;align-items:center;gap:4px;cursor:pointer;transition:transform .15s;transform-origin:left center}
  .school:hover{transform:scale(1.12)}
  .school .sdot{width:15px;height:15px;border-radius:50%;background:#3b5bdb;border:2px solid #fff;
                box-shadow:0 2px 6px rgba(30,40,90,.35);display:grid;place-items:center;font-size:8px;color:#fff;flex:none}
  .school .spct{font-size:10px;font-weight:800;color:#2942b8;background:rgba(255,255,255,.9);
                border-radius:5px;padding:0 3px;box-shadow:0 1px 4px rgba(30,40,90,.18);white-space:nowrap}
  .school.sec .sdot{background:#1e3a8a}.school.sec .spct{color:#1e3a8a}
  /* festival: a lit-up point that pulses, with its surge % and dates */
  .fest{display:flex;flex-direction:column;align-items:center;cursor:pointer}
  .fest .fdot{width:26px;height:26px;border-radius:50%;background:#db2777;border:3px solid #fff;
              display:grid;place-items:center;font-size:13px;box-shadow:0 0 0 0 rgba(219,39,119,.55);animation:festglow 1.8s infinite}
  .fest .flab{margin-top:3px;background:#db2777;color:#fff;font-size:10.5px;font-weight:800;border-radius:7px;
              padding:1px 7px;white-space:nowrap;box-shadow:0 3px 10px rgba(219,39,119,.35)}
  @keyframes festglow{0%{box-shadow:0 0 0 0 rgba(219,39,119,.5)}70%{box-shadow:0 0 0 14px rgba(219,39,119,0)}100%{box-shadow:0 0 0 0 rgba(219,39,119,0)}}
  /* side panel (unchanged look) */
  #panel{position:fixed;top:0;right:0;height:100%;width:390px;max-width:92vw;z-index:7;transform:translateX(105%);
         transition:transform .32s cubic-bezier(.4,0,.15,1);background:rgba(255,255,255,.9);backdrop-filter:blur(16px);
         border-left:1px solid var(--line);box-shadow:-16px 0 44px rgba(60,40,120,.12);overflow-y:auto}
  #panel.open{transform:none}
  .p-head{padding:20px 22px 14px;border-bottom:1px solid var(--line);position:relative}
  .p-brandtag{display:inline-block;font-size:11px;font-weight:700;color:#fff;padding:2px 9px;border-radius:6px;letter-spacing:.3px}
  .p-title{font-family:'Sora';font-size:21px;margin:9px 0 3px}
  .p-loc{font-size:12px;color:var(--muted)}
  .p-close{position:absolute;top:16px;right:16px;border:none;background:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1}
  .p-body{padding:16px 22px 40px}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  .kpi .l{font-size:11px;color:var(--muted)} .kpi .v{font-family:'Sora';font-size:20px;margin-top:2px}
  .kpi .v.gold{color:var(--gold)} .kpi .v.navy{color:var(--navy)}
  .sec{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
  #spark{width:100%;height:120px}
  .rowline{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .rowline .k{color:var(--muted)}
  .ev{display:flex;gap:9px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
  .ev .ic{width:22px;height:22px;border-radius:6px;flex:none;display:grid;place-items:center;font-size:12px;color:#fff}
  .ev .nm{font-weight:600;font-size:13px} .ev .dt{font-size:11px;color:var(--muted)}
  .ev .ef{margin-left:auto;font-size:12px;font-weight:700}
  .wxrow{display:flex;gap:6px}
  .wxday{flex:1;text-align:center;background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 2px}
  .wxday .wd{font-size:10px;color:var(--muted)} .wxday .wi{font-size:16px;margin:2px 0}
  .wxday .wt{font-size:12px;font-weight:700} .wxday .wr{font-size:10px;color:var(--muted)} .wxday .wr.on{color:var(--navy);font-weight:700}
</style>
</head>
<body>
<div id="map"></div>
<canvas id="rain"></canvas>
<header>
  <a class="btn" href="index.html" title="Back to dashboard">← Dashboard</a>
  <div class="brand">
    <h1>Donegal store network</h1>
    <div class="sub">RFS Checkout Analytics · real map · live demand, weather & events</div>
  </div>
  <div class="spacer"></div>
  <div class="controls">
    <button class="btn" id="btn-weather">☔ Rain</button>
    <button class="btn on" id="btn-events">◎ Events</button>
    <button class="btn" id="btn-fit">⤢ Fit county</button>
  </div>
</header>
<div class="ticker"><span class="dot"></span><span id="ticker-txt">Loading…</span></div>
<div class="legend" id="legend"></div>
<div class="foot" id="foot"></div>
<aside id="panel"></aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
const BRAND={Spar:{c:'#0a8a3d',tag:'#0a8a3d',glyph:'S'},SuperValu:{c:'#8a1c3f',tag:'#8a1c3f',glyph:'SV'}};
const EVCOL={holiday:'#d97706',gaa:'#6d28d9',payday:'#1e5da8',back_to_school:'#0ea5a4',festival:'#db2777',weather:'#2563eb',event:'#6d28d9'};
const EVLABEL={holiday:'Holiday',gaa:'GAA',payday:'Pay window',back_to_school:'Back-to-school',festival:'Festival',weather:'Weather'};
const WMO=c=>c==0?'Clear':c<3?'Partly cloudy':c<50?'Cloudy/fog':c<70?'Rain':c<80?'Snow':'Showers';
let stores=[], selected=null, rainOn=false, eventsOn=true, bounds=null;

const map=new maplibregl.Map({
  container:'map',
  style:'https://tiles.openfreemap.org/styles/positron',   // real OSM, light theme
  center:[-7.85,54.95], zoom:8.4, pitch:0, bearing:0, attributionControl:false,
  preserveDrawingBuffer:true,
});
map.addControl(new maplibregl.AttributionControl({compact:true}),'bottom-right');
map.addControl(new maplibregl.NavigationControl({showCompass:true}),'bottom-right');
if(window.ResizeObserver) new ResizeObserver(()=>map.resize()).observe(document.getElementById('map'));

map.on('style.load',()=>{
  // 3D building extrusions from the OpenMapTiles building layer (light purple)
  try{
    map.addLayer({id:'buildings3d',type:'fill-extrusion',source:'openmaptiles','source-layer':'building',minzoom:13.5,
      paint:{'fill-extrusion-color':['interpolate',['linear'],['zoom'],13.5,'#dcd7ee',17,'#c3b9e6'],
        'fill-extrusion-height':['case',['has','render_height'],['get','render_height'],8],
        'fill-extrusion-base':['case',['has','render_min_height'],['get','render_min_height'],0],
        'fill-extrusion-opacity':.72}});
  }catch(e){}
});

const fmt=v=>v==null?'–':d3.format(',')(Math.round(v));
const pct=v=>v==null?'–':(v>0?'+':'')+v+'%';
const fmtDate=d=>!d?'–':new Date(d+'T00:00:00').toLocaleDateString('en-IE',{day:'numeric',month:'short'});
const fmtRange=(a,b)=>{const A=new Date(a+'T00:00:00'),B=new Date(b+'T00:00:00');
  const dm={day:'numeric',month:'short'};
  return A.getMonth()===B.getMonth()?`${A.getDate()}–${B.toLocaleDateString('en-IE',dm)}`:`${A.toLocaleDateString('en-IE',dm)}–${B.toLocaleDateString('en-IE',dm)}`;};

// geographic circle polygon (km) for event radius
function circle(lng,lat,km,n=64){
  const co=[],dLat=km/110.574,dLng=km/(111.320*Math.cos(lat*Math.PI/180));
  for(let i=0;i<=n;i++){const a=i/n*2*Math.PI;co.push([lng+dLng*Math.cos(a),lat+dLat*Math.sin(a)]);}
  return {type:'Feature',geometry:{type:'Polygon',coordinates:[co]}};
}

// days from today until an event (0 = happening now, negative = past)
function daysUntil(e){
  const t=new Date(); const d0=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  if(e.date){ return Math.round((new Date(e.date+'T00:00:00')-d0)/864e5); }
  if(e.start&&e.end){ const s=new Date(e.start+'T00:00:00'), en=new Date(e.end+'T00:00:00');
    if(d0>=s&&d0<=en) return 0; if(d0<s) return Math.round((s-d0)/864e5); return -1; }
  return -1;
}
const relLabel=n=>n===0?'happening now':n===1?'tomorrow':`in ${n} days`;

fetch('./data/stores.json?v='+Date.now()).then(r=>r.json()).then(d=>{
  stores=d.stores;
  document.getElementById('foot').textContent=d.disclaimer;
  buildLegend();
  bounds=new maplibregl.LngLatBounds();
  stores.forEach(s=>{
    const b=BRAND[s.brand]||BRAND.Spar;
    // upcoming events ranked by how close they are to today (priority)
    s._up=(s.events||[]).filter(e=>e.type!=='payday').map(e=>({e,n:daysUntil(e)})).filter(x=>x.n>=0).sort((a,b)=>a.n-b.n);
    s._top=s._up[0]||null;
    // store marker: town label + teardrop pin
    const wrap=document.createElement('div'); wrap.className='pinwrap'; wrap.style.setProperty('--c', b.c);
    const lab=document.createElement('div'); lab.className='pinlab'; lab.textContent=s.town; wrap.appendChild(lab);
    const head=document.createElement('div'); head.className='pinhead '+(s.brand==='SuperValu'?'wide':'round');
    head.innerHTML = s.brand==='SuperValu'
      ? `<span class="wm-sv">SuperValu</span>`
      : `<svg class="spar-fir" viewBox="0 0 64 64" aria-hidden="true"><path fill="#fff" d="M32 9 L49 45 H37 V55 H27 V45 H15 Z"/></svg>`;
    wrap.appendChild(head);
    const tip=document.createElement('div'); tip.className='pintip'; wrap.appendChild(tip);
    wrap.title=`${s.brand} · ${s.town} — click for analytics`;
    wrap.addEventListener('click',()=>selectStore(s));
    s._marker=new maplibregl.Marker({element:wrap,anchor:'bottom'}).setLngLat([s.lon,s.lat]).addTo(map);
    bounds.extend([s.lon,s.lat]);
    // catchment ring — ALWAYS drawn for every store (this is the store's radius).
    // Coloured by the nearest upcoming event if there is one, else a neutral catchment tone.
    const ringCol = s._top ? (EVCOL[s._top.e.type]||EVCOL.event) : '#64748b';
    const src='ring-'+s.key, km=s.radius_km||3.4;
    const add=()=>addRing(src,circle(s.lon,s.lat,km),ringCol);
    if(map.isStyleLoaded()) add(); else { map.on('style.load',add); map.on('load',add); }
    s._ring=src; s._ringcol=ringCol;
    s._urgency=s._top?Math.max(0.3,1-Math.min(s._top.n,30)/30):0.5;   // closer event = stronger ring
    // event badge ON THE MAP: nearest upcoming event, with countdown + effect (priority)
    if(s._top){
      const e=s._top.e, c=ringCol, urgent=s._top.n<=7;
      const el=document.createElement('div'); el.className='evbadge'+(urgent?' urgent':'');
      el.style.setProperty('--c',c);
      el.innerHTML=`<span class="ed" style="background:${c}"></span>${e.icon||'◆'} ${EVLABEL[e.type]||''} · ${relLabel(s._top.n)}`+
        (e.effect_pct!=null?` · <b style="color:${c}">${pct(e.effect_pct)}</b>`:'');
      el.title=e.name; el.addEventListener('click',()=>selectStore(s));
      s._evmarker=new maplibregl.Marker({element:el,anchor:'bottom',offset:[0,-42]}).setLngLat([s.lon,s.lat]).addTo(map);
    }
    // REAL nearby schools inside the ring: a point on each, with its proximity surge %
    s._schoolMarkers=(s.schools||[]).map(sc=>{
      const el=document.createElement('div'); el.className='school'+(sc.level==='secondary'?' sec':'');
      el.innerHTML=`<span class="sdot">✎</span><span class="spct">+${sc.surge_pct}%</span>`;
      el.title=`${sc.name} — reopens ${fmtDate(sc.reopen_date)} · ${sc.dist_km} km from store · est. +${sc.surge_pct}% back-to-school lift`;
      el.addEventListener('click',()=>selectStore(s));
      return new maplibregl.Marker({element:el,anchor:'left'}).setLngLat([sc.lon,sc.lat]).addTo(map);
    });
    // festival lit up as a point, with surge % and dates (Spar only, illustrative)
    if(s.festival){
      const f=s.festival;
      const el=document.createElement('div'); el.className='fest';
      el.innerHTML=`<span class="fdot">♪</span><span class="flab">Festival · +${f.effect_pct}% · ${fmtRange(f.start,f.end)}</span>`;
      el.title=`${f.name} — ${f.venue} · ${fmtDate(f.start)}–${fmtDate(f.end)} · est. +${f.effect_pct}% surge`;
      el.addEventListener('click',()=>selectStore(s));
      s._festMarker=new maplibregl.Marker({element:el,anchor:'top'}).setLngLat([f.lon,f.lat]).addTo(map);
    }
  });
  buildTicker();
  fitToStores(true);
  pulseRings();
  liveRainToday();   // set the rain animation from what's happening NOW
}).catch(err=>{document.getElementById('ticker-txt').textContent='Could not load store data: '+err;});

// global "is it raining now" for the animation (today only, county-level)
function liveRainToday(){
  if(!stores.length)return; const s=stores[0];
  fetch(`https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lon}&daily=precipitation_sum&forecast_days=1&timezone=Europe/Dublin`)
    .then(r=>r.json()).then(d=>{ setRain((d.daily?.precipitation_sum?.[0]||0)>=1); }).catch(()=>{});
}
function setRain(v){ rainOn=v; const btn=document.getElementById('btn-weather'); if(btn) btn.classList.toggle('on',v); }

function fitToStores(instant){
  if(!bounds||bounds.isEmpty())return;
  const go=()=>{map.resize();map.fitBounds(bounds,{padding:{top:120,bottom:90,left:90,right:410},maxZoom:10.5,duration:instant?0:1400});};
  if(map.loaded()) go(); else map.once('load',go);
}

function addRing(src,geo,col){
  if(map.getSource(src)) return;
  map.addSource(src,{type:'geojson',data:geo});
  map.addLayer({id:src+'-f',type:'fill',source:src,paint:{'fill-color':col,'fill-opacity':.08}});
  map.addLayer({id:src+'-l',type:'line',source:src,paint:{'line-color':col,'line-width':2,'line-opacity':.6}});
}
function pulseRings(){
  const t=(performance.now()/1000)%2/2; // 0..1 (perf.now allowed in browser)
  stores.forEach(s=>{ if(s._ring && map.getLayer(s._ring+'-l')){
    const u=s._urgency||0.35;                       // closer event = stronger ring
    map.setPaintProperty(s._ring+'-l','line-opacity', eventsOn?(0.08+0.6*(1-t))*u+0.04:0);
    map.setPaintProperty(s._ring+'-f','fill-opacity', eventsOn?(0.02+0.12*(1-t))*u:0);
    if(s._evmarker) s._evmarker.getElement().style.opacity=eventsOn?1:0;
    (s._schoolMarkers||[]).forEach(m=>m.getElement().style.opacity=eventsOn?1:0);
    if(s._festMarker) s._festMarker.getElement().style.opacity=eventsOn?1:0;
  }});
  requestAnimationFrame(pulseRings);
}

function selectStore(s){
  openPanel(s);
  map.flyTo({center:[s.lon,s.lat],zoom:15.4,pitch:56,bearing:-18,duration:2400,curve:1.5,essential:true});
  map.once('moveend',()=>{setTimeout(()=>highlightBuilding(s),250);
    setTimeout(()=>{if(map.getSource('sel-bld')&&!map.getSource('sel-bld')._data.features.length)highlightBuilding(s);},900);});
}
// paint the store's actual OSM building in its brand colour ("embedded" on the shop).
// Only at high zoom, where the building layer holds individual footprints; at low zoom
// OpenMapTiles merges them into one big tile geometry, which must not be highlighted.
function spanMetres(geom){
  const pts=[]; const walk=a=>{typeof a[0]==='number'?pts.push(a):a.forEach(walk);}; walk(geom.coordinates);
  const lo=pts.map(p=>p[0]),la=pts.map(p=>p[1]);
  return {n:pts.length, m:Math.max((Math.max(...lo)-Math.min(...lo))*72000,(Math.max(...la)-Math.min(...la))*111000)};
}
function highlightBuilding(s){
  const b=BRAND[s.brand]||BRAND.Spar;
  // highlight THIS one store's real OSM building footprint in its brand colour
  const geo={type:'FeatureCollection',features: s.footprint?[{type:'Feature',
    geometry:{type:'Polygon',coordinates:s.footprint},properties:{}}]:[]};
  if(map.getSource('sel-bld')){ map.getSource('sel-bld').setData(geo); map.setPaintProperty('sel-bld','fill-extrusion-color',b.c); }
  else{
    map.addSource('sel-bld',{type:'geojson',data:geo});
    map.addLayer({id:'sel-bld',type:'fill-extrusion',source:'sel-bld',
      paint:{'fill-extrusion-color':b.c,'fill-extrusion-height':26,'fill-extrusion-base':0,'fill-extrusion-opacity':.95}});
  }
}
function clearBuilding(){ if(map.getSource('sel-bld')) map.getSource('sel-bld').setData({type:'FeatureCollection',features:[]}); }

function buildLegend(){
  document.getElementById('legend').innerHTML=
    `<span><span class="sw" style="background:${BRAND.Spar.c}"></span><b>Spar</b></span>
     <span><span class="sw" style="background:${BRAND.SuperValu.c}"></span><b>SuperValu</b></span>
     <span><span class="sw" style="background:#3b5bdb"></span>School (back-to-school)</span>
     <span><span class="sw" style="background:#db2777"></span>Festival</span>
     <span><span class="sw" style="background:${EVCOL.back_to_school}"></span>Catchment radius</span>
     <span style="color:var(--muted)">Real OpenStreetMap · click a store</span>`;
}
function buildTicker(){
  // nearest upcoming event per store, ordered by how close it is to today (priority)
  const rows=stores.filter(s=>s._top).map(s=>({town:s.town,e:s._top.e,n:s._top.n}));
  stores.filter(s=>s.festival).forEach(s=>rows.push({town:s.town,
    e:{name:s.festival.name,effect_pct:s.festival.effect_pct},n:daysUntil({start:s.festival.start,end:s.festival.end})}));
  const items=rows.filter(x=>x.n>=0).sort((a,b)=>a.n-b.n)
    .map(x=>`${x.town}: ${x.e.name} ${relLabel(x.n)}${x.e.effect_pct!=null?' '+pct(x.e.effect_pct):''}`);
  document.getElementById('ticker-txt').textContent=items.length?('Next up · '+items.join('   ·   ')):'No upcoming events';
}

function openPanel(s){
  selected=s; const col=BRAND[s.brand]||BRAND.Spar;
  const ev=(s.events||[]).map(e=>{
    const when=e.date||`${e.start} → ${e.end}`, c=EVCOL[e.type]||EVCOL.event, ic=e.icon||'◆';
    return `<div class="ev"><div class="ic" style="background:${c}">${ic}</div>
      <div><div class="nm">${e.name}</div><div class="dt">${EVLABEL[e.type]||''} · ${when}</div></div>
      <div class="ef" style="color:${c}">${e.effect_pct!=null?pct(e.effect_pct):''}</div></div>`;
  }).join('')||'<div class="dt" style="color:var(--muted);font-size:12px">No known events in the horizon.</div>';
  // festival nearby (illustrative), lit as its own block
  const fest = s.festival ? `
      <div class="sec">Festival nearby</div>
      <div class="ev"><div class="ic" style="background:#db2777">♪</div>
        <div><div class="nm">${s.festival.name}</div>
          <div class="dt">${s.festival.venue} · ${fmtDate(s.festival.start)}–${fmtDate(s.festival.end)}</div></div>
        <div class="ef" style="color:#db2777">+${s.festival.effect_pct}%</div></div>
      <div class="dt" style="color:var(--muted);font-size:11px;margin-top:2px">Illustrative nearby event; surge estimated from event-day analysis.</div>` : '';
  // real nearby schools, nearest first (closer = bigger back-to-school lift)
  const schools = (s.schools||[]).length ? (s.schools||[]).map(sc=>`
      <div class="rowline"><span class="k">✎ ${sc.name}
        <span style="color:var(--muted);font-weight:400">· reopens ${fmtDate(sc.reopen_date)} · ${sc.dist_km} km</span></span>
        <b style="color:#2942b8">+${sc.surge_pct}%</b></div>`).join('')
      : '<div class="dt" style="color:var(--muted);font-size:12px">No schools mapped inside the catchment.</div>';
  const schoolsSec = `
      <div class="sec">Back-to-school · nearby schools <span style="color:var(--muted);font-weight:400;font-size:11px">— real OSM, closer = bigger lift</span></div>
      ${schools}`;
  document.getElementById('panel').innerHTML=`
    <div class="p-head">
      <button class="p-close" onclick="closePanel()">×</button>
      <span class="p-brandtag" style="background:${col.tag}">${s.brand}</span>
      <div class="p-title">${s.store_type} store</div>
      <div class="p-loc">${s.real_place||s.town}, Co. Donegal · ${s.checkouts} checkouts · representative branch</div>
    </div>
    <div class="p-body">
      <div class="kpis">
        <div class="kpi"><div class="l">Transactions / day</div><div class="v">${fmt(s.daily_txns)}</div></div>
        <div class="kpi"><div class="l">Next 2 weeks</div><div class="v navy">${fmt(s.next2w_txns)}</div></div>
        <div class="kpi"><div class="l">Busy days ahead</div><div class="v gold">${s.busy_days}</div></div>
        <div class="kpi"><div class="l">Peak lanes</div><div class="v">${s.peak_lanes??'–'}</div></div>
      </div>
      <div class="sec">Demand · recent + 2-week forecast</div>
      <svg id="spark"></svg>
      <div class="sec">Weather next days · live</div>
      <div id="wx" class="wx"><div class="dt" style="color:var(--muted);font-size:12px">Loading Met forecast…</div></div>
      <div class="sec">What can move demand</div>
      <div class="rowline"><span class="k">Public holiday effect</span><b>${pct(s.holiday_effect_pct)}</b></div>
      <div class="rowline"><span class="k">Wet-day effect</span><b>${pct(s.weather.wet_effect_pct)}</b></div>
      <div class="rowline"><span class="k">Sunny-day effect</span><b>${pct(s.weather.sunny_effect_pct)}</b></div>
      ${fest}
      ${schoolsSec}
      <div class="sec">Nearby events &amp; effect</div>${ev}
      <div class="sec">Operations</div>
      <div class="rowline"><span class="k">Forecast accuracy (MASE)</span><b>${s.median_mase??'–'}</b></div>
      <div class="rowline"><span class="k">Unusual days flagged</span><b>${fmt(s.n_unusual_days)}</b></div>
      <div class="rowline"><span class="k">Over / under staffed lane-hrs</span><b>${fmt(s.over_lane_hours)} / ${fmt(s.under_lane_hours)}</b></div>
      <div class="rowline"><span class="k">Mis-staffing cost</span><b>€${fmt(s.mis_staffing_cost)}</b></div>
    </div>`;
  document.getElementById('panel').classList.add('open');
  drawSpark(s);
  fetchWeather(s);
}
function fetchWeather(s){
  const el=document.getElementById('wx'); if(!el)return;
  fetch(`https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lon}&daily=precipitation_sum,temperature_2m_max,weather_code&forecast_days=6&timezone=Europe/Dublin`)
    .then(r=>r.json()).then(d=>{
      const D=d.daily; if(!D){el.innerHTML='<div class="dt">No forecast.</div>';return;}
      let html='<div class="wxrow">';
      for(let i=0;i<Math.min(6,D.time.length);i++){
        const day=new Date(D.time[i]+'T00:00:00').toLocaleDateString('en-IE',{weekday:'short'});
        const rain=D.precipitation_sum[i], tmax=Math.round(D.temperature_2m_max[i]), code=D.weather_code[i], wet=rain>=1;
        const ic=code==0?'☀':code<3?'⛅':wet?'🌧':'☁';
        html+=`<div class="wxday"><div class="wd">${day}</div><div class="wi">${ic}</div><div class="wt">${tmax}°</div><div class="wr ${wet?'on':''}">${rain.toFixed(1)}</div></div>`;
      }
      html+='</div>';
      const rainToday=D.precipitation_sum[0]>=1;
      if(rainToday && s.weather.wet_effect_pct!=null)
        html+=`<div class="dt" style="margin-top:6px">Raining today → about <b style="color:${EVCOL.weather}">${pct(s.weather.wet_effect_pct)}</b> demand today.</div>`;
      else if(s.weather.sunny_effect_pct!=null)
        html+=`<div class="dt" style="margin-top:6px">Dry today → a sunny day adds about <b style="color:#d97706">${pct(s.weather.sunny_effect_pct)}</b>.</div>`;
      el.innerHTML=html;
      // rain animation only reflects weather happening NOW (today), never a future day
      setRain(rainToday);
    }).catch(()=>{el.innerHTML='<div class="dt" style="color:var(--muted)">Live weather unavailable.</div>';});
}
function closePanel(){document.getElementById('panel').classList.remove('open');selected=null;clearBuilding();map.easeTo({pitch:0,duration:900});}

function drawSpark(s){
  const R=s.spark.recent,F=s.spark.forecast,LO=s.spark.low,HI=s.spark.high;
  const svg=d3.select('#spark'); svg.selectAll('*').remove();
  const wd=svg.node().clientWidth||340,ht=120,m={t:8,r:6,b:16,l:6},n=R.length+F.length;
  const x=d3.scaleLinear().domain([0,n-1]).range([m.l,wd-m.r]);
  const all=R.concat(F,LO,HI).filter(v=>v!=null);
  const y=d3.scaleLinear().domain([d3.min(all)*.96,d3.max(all)*1.04]).range([ht-m.b,m.t]);
  const band=F.map((_,i)=>({i:R.length+i,lo:LO[i],hi:HI[i]}));
  svg.append('path').datum(band).attr('d',d3.area().x(d=>x(d.i)).y0(d=>y(d.lo)).y1(d=>y(d.hi)).curve(d3.curveMonotoneX)).attr('fill','#a78bfa').attr('opacity',.28);
  svg.append('path').datum(R).attr('d',d3.line().x((d,i)=>x(i)).y(d=>y(d)).curve(d3.curveMonotoneX)).attr('fill','none').attr('stroke','#46587a').attr('stroke-width',1.6);
  svg.append('path').datum(F).attr('d',d3.line().x((d,i)=>x(R.length+i)).y(d=>y(d)).curve(d3.curveMonotoneX)).attr('fill','none').attr('stroke','#6d28d9').attr('stroke-width',2.2);
  svg.append('line').attr('x1',x(R.length-.5)).attr('x2',x(R.length-.5)).attr('y1',m.t).attr('y2',ht-m.b).attr('stroke','#241d3a').attr('stroke-opacity',.35).attr('stroke-dasharray','3 3');
  svg.append('text').attr('x',x(R.length-.5)+4).attr('y',m.t+9).attr('font-size',9).attr('fill','#6b6580').text('today');
}

// rain overlay
const rc=document.getElementById('rain'),rx=rc.getContext('2d');let drops=[],RW,RH;
function rainResize(){RW=rc.width=window.innerWidth;RH=rc.height=window.innerHeight;}
window.addEventListener('resize',rainResize);rainResize();
for(let i=0;i<260;i++)drops.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,l:9+Math.random()*13,s:6+Math.random()*6});
function rain(){rx.clearRect(0,0,RW,RH);if(rainOn){rx.strokeStyle='rgba(70,110,180,.32)';rx.lineWidth=1.1;
  drops.forEach(d=>{rx.beginPath();rx.moveTo(d.x,d.y);rx.lineTo(d.x-3,d.y+d.l);rx.stroke();d.y+=d.s;d.x-=1.6;if(d.y>RH){d.y=-10;d.x=Math.random()*RW;}});
  rx.fillStyle='rgba(150,175,210,.05)';rx.fillRect(0,0,RW,RH);}requestAnimationFrame(rain);}
rain();

document.getElementById('btn-weather').onclick=e=>{rainOn=!rainOn;e.target.classList.toggle('on',rainOn);};
document.getElementById('btn-events').onclick=e=>{eventsOn=!eventsOn;e.target.classList.toggle('on',eventsOn);};
document.getElementById('btn-fit').onclick=()=>{closePanel();fitToStores(false);};
</script>
</body>
